name: Build Agents Anywhere IPA

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unsigned IPA for iOS 18
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Apply Compatibility Patches
        run: |
          # 1. Clean up trailing commas in parameter/argument lists for Swift 6.0 compatibility
          node -e '
          const fs = require("fs");
          const path = require("path");

          function walk(dir) {
            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);
              if (fs.statSync(full).isDirectory()) walk(full);
              else if (full.endsWith(".swift")) {
                const orig = fs.readFileSync(full, "utf-8");
                const patched = orig.replace(/,(\s*\))/g, "$1");
                if (orig !== patched) {
                  fs.writeFileSync(full, patched, "utf-8");
                  console.log("Fixed trailing commas:", full);
                }
              }
            }
          }
          walk("ios/Agents Anywhere");
          '

          # 2. Add glassEffect and .rect compat for iOS 18 SwiftUI
          cat > "ios/Agents Anywhere/Agents Anywhere/App/GlassEffectCompat.swift" <<'EOF'
          import SwiftUI

          public enum GlassStyle: Sendable {
              case regular
              case clear
          }

          extension Shape where Self == RoundedRectangle {
              public static func rect(cornerRadius: CGFloat) -> RoundedRectangle {
                  RoundedRectangle(cornerRadius: cornerRadius)
              }
          }

          extension View {
              @ViewBuilder
              public func glassEffect(_ style: GlassStyle = .regular, in shape: some Shape = Rectangle()) -> some View {
                  self.background(.ultraThinMaterial, in: shape)
              }
          }
          EOF

      - name: Build Archive (Unsigned)
        run: |
          cd "ios/Agents Anywhere"
          xcodebuild archive \
            -project "Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AgentsAnywhere.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Create IPA Payload
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/AgentsAnywhere.xcarchive/Products/Applications/Agents Anywhere.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r -9 "AgentsAnywhere-iOS18.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentsAnywhere-iOS18
          path: ${{ runner.temp }}/AgentsAnywhere-iOS18.ipa
          retention-days: 14
          if-no-files-found: error
