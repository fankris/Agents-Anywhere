name: Build Agents Anywhere IPA

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Unsigned IPA for iOS 18
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 16
        run: |
          ls -d /Applications/Xcode*
          if [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Apply Compatibility Patches
        run: |
          # 1. Add comprehensive AppThemeCompat.swift
          cat > "ios/Agents Anywhere/Agents Anywhere/App/AppThemeCompat.swift" <<'EOF'
          import SwiftUI

          // 1. Glass Styles
          public struct GlassStyle: Sendable, Hashable {
              public static let regular = GlassStyle()
              public static let clear = GlassStyle()
              public static let interactive = GlassStyle()
              public init() {}
              public func interactive() -> GlassStyle { self }
          }

          // 2. Button Roles
          extension ButtonRole {
              public static let close = ButtonRole.cancel
              public static let confirm = ButtonRole.cancel
          }

          // 3. ToolbarItemPlacement
          extension ToolbarItemPlacement {
              public static let subtitle = ToolbarItemPlacement.principal
          }

          // 4. Shapes & Shapes Helpers
          extension Shape where Self == RoundedRectangle {
              public static func rect(cornerRadius: CGFloat) -> RoundedRectangle {
                  RoundedRectangle(cornerRadius: cornerRadius)
              }
          }

          extension Shape where Self == Capsule {
              public static var capsule: Capsule { Capsule() }
          }

          extension Shape where Self == Circle {
              public static var circle: Circle { Circle() }
          }

          extension Shape where Self == Rectangle {
              public static var rect: Rectangle { Rectangle() }
          }

          public struct ConcentricRectangleCorners: Sendable {
              public static func fixed(_ r: CGFloat) -> ConcentricRectangleCorners { ConcentricRectangleCorners() }
              public static let concentric = ConcentricRectangleCorners()
              public init() {}
          }

          public struct ConcentricRectangle: Shape {
              public var corners: ConcentricRectangleCorners = .concentric
              public init(corners: ConcentricRectangleCorners = .concentric) {
                  self.corners = corners
              }
              public init(cornerRadius: CGFloat = 0) {}
              public func path(in rect: CGRect) -> Path {
                  RoundedRectangle(cornerRadius: 16).path(in: rect)
              }
          }

          // 5. ScrollEdgeEffectStyle
          public struct ScrollEdgeEffectStyle: Sendable, Hashable {
              public static let soft = ScrollEdgeEffectStyle()
              public static let hard = ScrollEdgeEffectStyle()
              public static let none = ScrollEdgeEffectStyle()
              public init() {}
          }

          // 6. ScrollAnchorRole
          public enum ScrollAnchorRole: Sendable {
              case initialOffset
              case alignment
              case sizeChanges
          }

          // 7. View Extensions
          extension View {
              @ViewBuilder
              public func glassEffect(_ style: GlassStyle = .regular, in shape: some Shape = Rectangle()) -> some View {
                  self.background(.ultraThinMaterial, in: shape)
              }

              @ViewBuilder
              public func glassEffectID(_ id: AnyHashable, in namespace: Namespace.ID) -> some View {
                  self
              }

              @ViewBuilder
              public func scrollEdgeEffectStyle(_ style: ScrollEdgeEffectStyle = .soft, for edge: Edge.Set = .all) -> some View {
                  self
              }

              @ViewBuilder
              public func scrollEdgeEffectStyle(_ args: Any...) -> some View {
                  self
              }

              @ViewBuilder
              public func defaultScrollAnchor(_ anchor: UnitPoint, for role: ScrollAnchorRole) -> some View {
                  self.defaultScrollAnchor(anchor)
              }

              @ViewBuilder
              public func containerCornerOffset(_ edge: Axis.Set = .horizontal, sizeToFit: Bool = false) -> some View {
                  self
              }

              @ViewBuilder
              public func safeAreaBar<Bar: View>(edge: Edge = .top, spacing: CGFloat = 0, @ViewBuilder content: () -> Bar) -> some View {
                  self.safeAreaInset(edge: edge, spacing: spacing, content: content)
              }

              @ViewBuilder
              public func safeAreaBar(_ edge: Edge = .top) -> some View {
                  self
              }

              @ViewBuilder
              public func safeAreaBar(_ args: Any...) -> some View {
                  self
              }
          }

          // 8. GlassEffectContainer
          public struct GlassEffectContainer<Content: View>: View {
              public var spacing: CGFloat?
              public let content: () -> Content

              public init(spacing: CGFloat? = nil, @ViewBuilder content: @escaping () -> Content) {
                  self.spacing = spacing
                  self.content = content
              }

              public var body: some View {
                  content()
              }
          }

          // 9. PrimitiveButtonStyle (.glass, .glassProminent)
          extension PrimitiveButtonStyle where Self == BorderedButtonStyle {
              public static var glass: BorderedButtonStyle { .bordered }
          }

          extension PrimitiveButtonStyle where Self == BorderedProminentButtonStyle {
              public static var glassProminent: BorderedProminentButtonStyle { .borderedProminent }
          }
          EOF

          # 2. Run AST/regex cleanups across Swift files
          node -e '
          const fs = require("fs");
          const path = require("path");

          function walk(dir) {
            for (const item of fs.readdirSync(dir)) {
              const full = path.join(dir, item);
              if (fs.statSync(full).isDirectory()) {
                walk(full);
              } else if (full.endsWith(".swift")) {
                let content = fs.readFileSync(full, "utf-8");
                const orig = content;

                // Strip trailing commas before closing parenthesis
                content = content.replace(/,(\s*\))/g, "$1");

                // Strip nonisolated modifier on types/extensions (invalid in Swift 6.0)
                content = content.replace(/\bnonisolated\s+((?:(?:public|private|internal|fileprivate|final)\s+)*(?:struct|enum|class|actor|extension))\b/g, "$1");

                // Remove .sharedBackgroundVisibility and .navigationSubtitle
                content = content.replace(/\.sharedBackgroundVisibility\([^)]*\)/g, "");
                content = content.replace(/\.navigationSubtitle\([^)]*\)/g, "");

                // Fix HTTPReadRetryPolicy.permitsRetry (@MainActor -> nonisolated)
                if (full.endsWith("HTTPReadRetryPolicy.swift")) {
                  content = content.replace("@MainActor func permitsRetry", "func permitsRetry");
                }

                // Fix TimelineGrouping, TimelineTurnActions, NewSessionSubmission, TimelineRowStructure actor isolation
                if (full.endsWith("TimelineGrouping.swift")) {
                  content = content.replace("struct ChatTimelineGroup: Identifiable", "@MainActor struct ChatTimelineGroup: Identifiable");
                  content = content.replace("enum TimelineGrouping", "@MainActor enum TimelineGrouping");
                }
                if (full.endsWith("TimelineRowStructure.swift")) {
                  content = content.replace("struct TimelineRowStructure", "@MainActor struct TimelineRowStructure");
                }
                if (full.endsWith("TimelineTurnActions.swift")) {
                  content = content.replace("struct TimelineTurnAction", "@MainActor struct TimelineTurnAction");
                  content = content.replace("enum TimelineTurnActions", "@MainActor enum TimelineTurnActions");
                }
                if (full.endsWith("NewSessionSubmission.swift")) {
                  content = content.replace("struct NewSessionSubmission", "@MainActor struct NewSessionSubmission");
                }

                if (content !== orig) {
                  fs.writeFileSync(full, content, "utf-8");
                  console.log("Patched:", full);
                }
              }
            }
          }
          walk("ios/Agents Anywhere");
          '

      - name: Build Archive (Unsigned)
        run: |
          cd "ios/Agents Anywhere"
          xcodebuild archive \
            -project "Agents Anywhere.xcodeproj" \
            -scheme "Agents Anywhere" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/AgentsAnywhere.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM=""

      - name: Create IPA Payload
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$RUNNER_TEMP/AgentsAnywhere.xcarchive/Products/Applications/Agents Anywhere.app" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r -9 "AgentsAnywhere-iOS18.ipa" Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgentsAnywhere-iOS18
          path: ${{ runner.temp }}/AgentsAnywhere-iOS18.ipa
          retention-days: 14
          if-no-files-found: error
